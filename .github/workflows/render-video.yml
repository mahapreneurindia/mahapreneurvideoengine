name: Render Cinematic Video
on:
  repository_dispatch:
    types: [generate_video]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Requirements
        run: pip install -r requirements.txt

      - name: Clone Cinematic Skill
        run: git clone https://github.com/Moh4696/cinematic-skill.git /tmp/cinematic-skill

      - name: Process Sarvam AI & Render Video
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          echo "Executing TTS and Skia rendering pipeline..."
          mkdir -p /tmp/video-job

          # Save the incoming Next.js payload (script, theme, job_id) to a JSON file
          cat << 'EOF' > /tmp/video-job/payload.json
          ${{ toJSON(github.event.client_payload) }}
          EOF

          # Execute the headless cinematic-skill orchestrator
          python3 scripts/orchestrate_cinematic.py --payload /tmp/video-job/payload.json --output /tmp/video-job/final.mp4

      - name: Upload to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
        run: python3 scripts/upload_to_supabase.py /tmp/video-job/final.mp4 $JOB_ID

      - name: Send Webhook to Next.js
        if: always()
        env:
          NEXTJS_APP_URL: ${{ secrets.NEXTJS_APP_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          JOB_ID: ${{ github.event.client_payload.job_id }}
          SUPABASE_URL: "https://your-supabase-url.supabase.co/storage/v1/object/public/media/${{ github.event.client_payload.job_id }}.mp4"
          JOB_STATUS: ${{ job.status }}
        run: |
          # Map GitHub status to our DB status
          if [ "$JOB_STATUS" == "success" ]; then
            FINAL_STATUS="completed"
          else
            FINAL_STATUS="failed"
          fi

          curl -X POST "$NEXTJS_APP_URL/api/video/webhook" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $WEBHOOK_SECRET" \
            -d "{\"job_id\": \"$JOB_ID\", \"status\": \"$FINAL_STATUS\", \"supabase_url\": \"$SUPABASE_URL\"}"
